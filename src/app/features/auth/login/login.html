<div class="vet-login-container d-flex justify-content-center align-items-center min-vh-100">
  <div class="card shadow-lg border-0 rounded-4 login-card">
    <div class="card-body p-4 p-md-5">
      
      <div class="text-center mb-4">
        <div class="vet-avatar-circle mb-3">
          <img 
            src="https://cdn-icons-png.flaticon.com/512/4514/4514759.png" 
            alt="Admin Avatar" 
            class="avatar-img"
          >
        </div>
        
        <h2 class="fw-bold mb-1 text-white text-shadow">Veterinaria Petizoos</h2>
        <p class="text-white-50 small">Panel de Administración</p>
      </div>

      <form (ngSubmit)="login()">
        
        <div class="mb-3">
          <label class="form-label text-white fw-semibold small ms-1">Correo Electrónico</label>
          <input 
            [(ngModel)]="dto.email" 
            name="email" 
            type="email"
            class="form-control vet-input" 
            placeholder="Ej. admin@petizoos.com"
            required 
          />
        </div>

        <div class="mb-4">
          <label class="form-label text-white fw-semibold small ms-1">Contraseña</label>
          <input 
            [(ngModel)]="dto.password" 
            name="password" 
            type="password" 
            class="form-control vet-input" 
            placeholder="••••••••"
            required 
          />
        </div>

        <button class="btn btn-vet w-100 py-2 rounded-3 fw-bold mb-4 shadow-sm" type="submit">
          Ingresar
        </button>

        <div class="text-center">
          <p class="text-white-50 small mb-0">
            ¿Olvidaste tu contraseña?
          </p>
          <small class="text-warning fw-bold">
            Contáctate con tu administrador
          </small>
        </div>

      </form>
    </div>
  </div>
</div>
