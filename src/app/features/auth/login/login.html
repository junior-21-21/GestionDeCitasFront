<div class="vet-login-container">
  <div class="login-card">
    
    <div class="header-text">
      <div class="vet-avatar-circle">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #20c997;">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
        </svg>
      </div>
      <h2>Veterinaria Petyzoos</h2>
      <p>Panel de Administración</p>
    </div>

    <form (ngSubmit)="login()">
      
      <div class="input-group">
        <label>Correo Electrónico</label>
        <input 
          [(ngModel)]="dto.email" 
          name="email" 
          type="email"
          class="vet-input" 
          placeholder="admin@petyzoos.com"
          required 
        />
      </div>

      <div class="input-group">
        <label>Contraseña</label>
        <input 
          [(ngModel)]="dto.password" 
          name="password" 
          type="password" 
          class="vet-input" 
          placeholder="••••••••"
          required 
        />
      </div>

      <button class="btn-vet" type="submit">
        Ingresar al sistema
      </button>

    </form>

    <div class="footer-text">
      <p>¿Problemas para acceder?</p>
      <small>Contactar al administrador</small>
    </div>

  </div>
</div>
