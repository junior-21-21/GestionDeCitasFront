<div class="container d-flex justify-content-center align-items-center min-vh-100 bg-light">
  <div class="card shadow p-4 login-card" style="width: 100%; max-width: 400px;">
    <h2 class="text-center mb-4">REGISTRO PRIMER ADMIN</h2>

    <form (ngSubmit)="registrar()">
      <div class="mb-3">
        <label class="form-label">Nombres</label>
        <input [(ngModel)]="dto.nombres" name="nombres" class="form-control" required />
      </div>

      <div class="mb-3">
        <label class="form-label">Correo Electrónico</label>
        <input [(ngModel)]="dto.email" name="email" type="email" class="form-control" placeholder="admin@petizoos.com" required />
      </div>

      <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input [(ngModel)]="dto.password" name="password" type="password" class="form-control" required />
      </div>

      <div class="text-danger mb-3" *ngIf="error">
        {{ error }}
      </div>

      <button class="btn btn-primary w-100" type="submit">Registrar</button>

      <p class="text-center mt-3 mb-0">
        ¿Ya tienes cuenta?
        <a (click)="irALogin()" class="text-decoration-none text-primary" style="cursor: pointer;">
          Inicia sesión
        </a>
      </p>
    </form>
  </div>
</div>
