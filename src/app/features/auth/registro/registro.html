<div class="registro-page">
  <div class="registro-card">
    <div class="card-header">
      <span class="brand-icon">🐾</span>
      <h1>Crear Cuenta</h1>
      <p>Únete a PetyZoos y empieza a comprar</p>
    </div>

    <form (ngSubmit)="registrar()" class="registro-form">
      <div class="form-row">
        <div class="form-group">
          <label for="nombres">Nombres *</label>
          <input type="text" id="nombres" [(ngModel)]="nombres" name="nombres" placeholder="Tu nombre" required />
        </div>
        <div class="form-group">
          <label for="apellidos">Apellidos *</label>
          <input type="text" id="apellidos" [(ngModel)]="apellidos" name="apellidos" placeholder="Tu apellido" required />
        </div>
      </div>

      <div class="form-group">
        <label for="email">Correo electrónico *</label>
        <input type="email" id="email" [(ngModel)]="email" name="email" placeholder="correo@ejemplo.com" required />
      </div>

      <div class="form-group">
        <label for="telefono">Teléfono</label>
        <input type="text" id="telefono" [(ngModel)]="telefono" name="telefono" placeholder="999 888 777" />
      </div>

      <div class="form-group">
        <label for="password">Contraseña *</label>
        <div class="input-password">
          <input [type]="showPassword ? 'text' : 'password'" id="password" [(ngModel)]="password" name="password"
                 placeholder="Mínimo 6 caracteres" required minlength="6" />
          <button type="button" class="toggle-pw" (click)="showPassword = !showPassword">
            {{ showPassword ? '🙈' : '👁️' }}
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmar contraseña *</label>
        <input type="password" id="confirmPassword" [(ngModel)]="confirmPassword" name="confirmPassword"
               placeholder="Repite tu contraseña" required />
        <span class="error-hint" *ngIf="confirmPassword && password !== confirmPassword">
          Las contraseñas no coinciden
        </span>
      </div>

      <button type="submit" class="btn-registrar" [disabled]="cargando" id="btn-registrar">
        <span *ngIf="!cargando">Crear cuenta</span>
        <span *ngIf="cargando">Creando cuenta...</span>
      </button>
    </form>

    <p class="login-link">
      ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
    </p>


  </div>
</div>
