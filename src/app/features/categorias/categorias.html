<div class="container mt-4 mb-5 fade-in">

  <h2 class="premium-title">
    <i class="bi bi-tags-fill me-2"></i>Gestión de Categorías de Productos
  </h2>

  <!-- FORMULARIO -->
  <div class="card mb-4 shadow-sm">
    <div class="card-header bg-primary text-white d-flex align-items-center">
      <i class="bi bi-plus-circle me-2"></i>
      <span>{{ editando ? 'Editar Categoría' : 'Nueva Categoría' }}</span>
    </div>
    <div class="card-body">
      <form (ngSubmit)="guardar()" class="row g-3">
        <div class="col-md-5">
          <label class="form-label fw-bold">Nombre *</label>
          <input type="text" class="form-control" [(ngModel)]="nueva.nombre" name="nombre"
                 placeholder="Ej. Medicamentos, Alimentos..." required />
        </div>
        <div class="col-md-5">
          <label class="form-label fw-bold">Descripción</label>
          <input type="text" class="form-control" [(ngModel)]="nueva.descripcion" name="descripcion"
                 placeholder="Descripción opcional" />
        </div>
        <div class="col-md-2 d-flex align-items-end gap-2">
          <button type="submit" class="btn btn-success flex-grow-1">
            <i class="bi" [ngClass]="editando ? 'bi-check-lg' : 'bi-plus-lg'"></i>
            {{ editando ? 'Actualizar' : 'Crear' }}
          </button>
          <button *ngIf="editando" type="button" class="btn btn-outline-secondary" (click)="cancelarEdicion()">
            <i class="bi bi-x-lg"></i>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- LISTADO -->
  <div class="card shadow-sm">
    <div class="card-header bg-white d-flex justify-content-between align-items-center">
      <h5 class="mb-0 fw-bold text-primary">
        <i class="bi bi-list-ul me-2"></i>Categorías Registradas
      </h5>
      <span class="badge bg-primary rounded-pill">{{ categorias.length }} categorías</span>
    </div>
    <div class="card-body p-0">

      <div *ngIf="categorias.length === 0" class="p-5 text-center text-muted">
        <i class="bi bi-inbox display-4"></i>
        <p class="mt-2">No hay categorías registradas.</p>
      </div>

      <div class="table-responsive" *ngIf="categorias.length > 0">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Descripción</th>
              <th class="text-center">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let cat of categorias" class="border-bottom">
              <td>
                <span class="badge bg-secondary">{{ cat.id }}</span>
              </td>
              <td class="fw-bold">{{ cat.nombre }}</td>
              <td class="text-muted">{{ cat.descripcion || '—' }}</td>
              <td class="text-center">
                <div class="d-flex justify-content-center gap-2">
                  <button class="btn btn-outline-primary btn-sm" (click)="editar(cat)" title="Editar">
                    <i class="bi bi-pencil-fill"></i> Editar
                  </button>
                  <button class="btn btn-outline-danger btn-sm" (click)="eliminar(cat.id!)" title="Eliminar">
                    <i class="bi bi-trash-fill"></i> Eliminar
                  </button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>

</div>
