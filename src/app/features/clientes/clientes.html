<div class="container mt-5">
  <!-- Mensajes -->
  <div *ngIf="mensajeExito" class="alert alert-success shadow-sm rounded">
    {{ mensajeExito }}
  </div>
  <div *ngIf="mensajeError" class="alert alert-danger shadow-sm rounded">
    {{ mensajeError }}
  </div>

  <!-- Formulario de Registro/Edición -->
  <div class="card shadow-sm p-4 mb-5">
    <h4 class="text-primary mb-4 border-bottom pb-2">
      {{ modoEditar ? '✏️ Editar Cliente' : '📝 Registrar Nuevo Cliente' }}
    </h4>

    <form (ngSubmit)="guardar()" #clienteForm="ngForm" class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Nombres</label>
        <input type="text" class="form-control" [(ngModel)]="nuevoCliente.nombres" name="nombres" required />
      </div>

      <div class="col-md-6">
        <label class="form-label">Correo</label>
        <input type="email" class="form-control" [(ngModel)]="nuevoCliente.correo" name="correo" />
      </div>

      <div class="col-md-6">
        <label class="form-label">DNI</label>
        <input type="text" maxlength="8" minlength="8" class="form-control" [(ngModel)]="nuevoCliente.dni" name="dni" required />
      </div>

      <div class="col-12 d-flex justify-content-end gap-3 mt-3">
        <button type="submit" class="btn btn-primary">
          {{ modoEditar ? 'Actualizar' : 'Registrar' }}
        </button>
        <button type="button" class="btn btn-outline-danger" (click)="reset()">Cancelar</button>
      </div>
    </form>
  </div>

  <!-- Lista de Clientes -->
  <div class="card shadow-sm p-4">
    <h4 class="text-secondary mb-4 border-bottom pb-2">📋 Lista de Clientes</h4>

    <div class="table-responsive">
      <table class="table table-bordered table-hover align-middle rounded shadow-sm">
        <thead class="table-light">
        <tr>
          <th class="text-primary">Nombre</th>
          <th class="text-primary">Correo</th>
          <th class="text-primary">DNI</th>
          <th class="text-primary">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let cliente of clientes">
          <td>{{ cliente.nombres }}</td>
          <td>{{ cliente.correo }}</td>
          <td>{{ cliente.dni }}</td>
          <td>
            <div class="d-flex gap-2">
              <button class="btn btn-sm btn-warning" (click)="editar(cliente)" title="Editar cliente">
                <i class="bi bi-pencil-fill"></i>
              </button>
              <button class="btn btn-sm btn-danger" (click)="eliminar(cliente.id!)" title="Eliminar cliente">
                <i class="bi bi-trash-fill"></i>
              </button>
            </div>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
