<div class="home-container" [ngClass]="rolClass">

  <!-- Columna izquierda: Texto -->
  <div class="home-left">
    <div class="welcome-badge">
      <span>{{ rolBadge }}</span>
    </div>

    <h1 class="home-title">
      Bienvenido(a) a<br>
      <span class="highlight">Petyzoos</span>
    </h1>

    <p class="home-greeting">
      {{ saludo }}, <strong>{{ nombreUsuario }}</strong>
    </p>

    <p class="home-description">{{ mensajeRol }}</p>

    <p class="home-slogan">"No solo son mascotas, son familia"</p>

    <div class="home-date">{{ fechaActual }}</div>
  </div>

  <!-- Columna derecha: Ilustracion -->
  <div class="home-right">
    <img src="vet_welcome.png" alt="Bienvenida Clinica Veterinaria" class="home-illustration">
  </div>

</div>
