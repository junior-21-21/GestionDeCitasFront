<div class="container py-5">
  <h2 class="text-center mb-4 text-primary">Gestión de Especialidades</h2>

  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <h5 class="card-title text-secondary">Registrar Nueva Especialidad</h5>
      <form (ngSubmit)="registrar()">
        <div class="input-group">
          <input
            type="text"
            [(ngModel)]="nuevaEspecialidad.nombre"
            name="nombre"
            required
            placeholder="Nombre de especialidad"
            class="form-control form-control-lg border-0 shadow-sm"
          />
          <button type="submit" class="btn btn-primary btn-lg ms-2">
            <i class="bi bi-plus-circle-fill me-2"></i>Registrar
          </button>
        </div>
      </form>
    </div>
  </div>

  <div *ngIf="especialidades.length > 0; else noEspecialidades" class="card shadow-sm">
    <div class="card-body">
      <h5 class="card-title text-secondary">Especialidades Registradas</h5>
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="bg-light">
          <tr>
            <th scope="col" class="text-secondary">ID</th>
            <th scope="col" class="text-secondary">Nombre</th>
            <th scope="col" class="text-secondary">Acciones</th>
          </tr>
          </thead>
          <tbody>
          <tr *ngFor="let esp of especialidades">
            <td>{{ esp.id }}</td>
            <td>{{ esp.nombre }}</td>
            <td>
              <button (click)="eliminar(esp.id!)" class="btn btn-outline-danger btn-sm">
                <i class="bi bi-trash-fill"></i> Eliminar
              </button>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <ng-template #noEspecialidades>
    <div class="alert alert-info shadow-sm text-center" role="alert">
      <i class="bi bi-info-circle-fill me-2"></i>No hay especialidades registradas.
    </div>
  </ng-template>
</div>
