<div class="container mt-4 fade-in">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="fw-bold text-primary mb-0"><i class="bi bi-tags me-2"></i>Categorías</h2>
      <p class="text-muted">Clasificación de productos e insumos</p>
    </div>
    <button class="btn btn-primary shadow-sm" (click)="abrirModalNuevo()">
      <i class="bi bi-plus-lg me-1"></i> Nueva Categoría
    </button>
  </div>

  <div class="card border-0 shadow-sm rounded-4">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th class="ps-4">Nombre</th>
              <th>Descripción</th>
              <th class="text-end pe-4" style="width: 150px;">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let c of categorias">
              <td class="ps-4 fw-bold">{{c.nombre}}</td>
              <td class="text-muted">{{c.descripcion || 'Sin descripción'}}</td>
              <td class="text-end pe-4">
                <button class="btn btn-sm btn-light text-primary me-2 shadow-sm rounded-circle" (click)="abrirModalEditar(c)" title="Editar">
                  <i class="bi bi-pencil"></i>
                </button>
                <button class="btn btn-sm btn-light text-danger shadow-sm rounded-circle" (click)="eliminar(c.id!)" title="Eliminar">
                  <i class="bi bi-trash"></i>
                </button>
              </td>
            </tr>
            <tr *ngIf="categorias.length === 0">
              <td colspan="4" class="text-center py-5 text-muted">
                <i class="bi bi-inbox fs-1 mb-2 d-block"></i>
                No hay categorías registradas
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Modal Formulario -->
<div class="modal fade show" tabindex="-1" style="display: block; background: rgba(0,0,0,0.5);" *ngIf="mostrarModal">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
      <div class="modal-header bg-primary text-white border-0 py-3">
        <h5 class="modal-title fw-bold">
          <i class="bi" [ngClass]="modoEdicion ? 'bi-pencil-square' : 'bi-plus-circle'"></i> 
          {{modoEdicion ? 'Editar Categoría' : 'Nueva Categoría'}}
        </h5>
        <button type="button" class="btn-close btn-close-white" (click)="cerrarModal()"></button>
      </div>
      
      <div class="modal-body p-4 bg-light">
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label fw-semibold">Nombre *</label>
            <input type="text" class="form-control rounded-3" [(ngModel)]="categoriaActual.nombre" placeholder="Ej. Antibióticos, Juguetes...">
          </div>
          <div class="col-12">
            <label class="form-label fw-semibold">Descripción (Opcional)</label>
            <textarea class="form-control rounded-3" [(ngModel)]="categoriaActual.descripcion" rows="3" placeholder="Detalles de la categoría..."></textarea>
          </div>
        </div>
      </div>
      
      <div class="modal-footer border-0 bg-white py-3">
        <button type="button" class="btn btn-light text-muted fw-bold px-4 rounded-3" (click)="cerrarModal()">Cancelar</button>
        <button type="button" class="btn btn-primary fw-bold px-4 rounded-3 shadow-sm" (click)="guardar()">
          <i class="bi bi-save me-1"></i> Guardar
        </button>
      </div>
    </div>
  </div>
</div>
