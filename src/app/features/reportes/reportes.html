<div class="reportes-container">
  <div class="header-section">
    <h1>Dashboard de Reportes</h1>
    <p>Resumen general de operaciones de la Clínica Veterinaria Petyzoos</p>
  </div>

  <div class="summary-cards">
    <div class="card total-sales">
      <div class="card-icon">
        <i class="fas fa-coins"></i>
      </div>
      <div class="card-info">
        <h3>Total Ventas (Historico)</h3>
        <p class="amount">S/ {{ totalVentas | number:'1.2-2' }}</p>
      </div>
    </div>
  </div>

  <div class="charts-grid">
    <!-- Sales Chart -->
    <div class="chart-card large">
      <div class="chart-header">
        <h2>Evolución de Ventas</h2>
        <div class="date-filters">
          <input
            type="date"
            [(ngModel)]="fechaInicio"
            class="form-control form-control-sm"
          />
          <span> a </span>
          <input
            type="date"
            [(ngModel)]="fechaFin"
            class="form-control form-control-sm"
          />
          <button
            class="btn btn-primary btn-sm ms-2"
            (click)="cargarVentasPorFecha()"
          >
            <i class="fas fa-filter"></i> Filtrar
          </button>
        </div>
      </div>
      <div
        class="chart-body"
        *ngIf="lineChartData.datasets[0].data.length > 0; else noSalesData"
      >
        <canvas
          baseChart
          [data]="lineChartData"
          [options]="lineChartOptions"
          [type]="lineChartType"
        >
        </canvas>
      </div>
      <ng-template #noSalesData>
        <div class="empty-state">
          No hay ventas registradas en este rango de fechas.
        </div>
      </ng-template>
    </div>

    <!-- Top Products -->
    <div class="chart-card">
      <div class="chart-header">
        <h2>Top 5 Productos Vendidos</h2>
      </div>
      <div class="chart-body" *ngIf="barChartData.datasets[0].data.length > 0">
        <canvas
          baseChart
          [data]="barChartData"
          [options]="barChartOptions"
          [type]="barChartType"
        >
        </canvas>
      </div>
    </div>

    <!-- Animal Species -->
    <div class="chart-card">
      <div class="chart-header">
        <h2>Especies Más Atendidas</h2>
      </div>
      <div class="chart-body" *ngIf="pieChartData.datasets[0].data.length > 0">
        <canvas
          baseChart
          [data]="pieChartData"
          [options]="pieChartOptions"
          [type]="pieChartType"
        >
        </canvas>
      </div>
    </div>
  </div>
</div>
