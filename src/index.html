<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Clínica Veterinaria</title>
  <base href="/">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      min-height: 100vh;

      background: linear-gradient(to bottom right, #d0f0fd, #e6faff); /* Degradado celeste pastel */
      background-attachment: fixed;
      background-repeat: no-repeat;
      background-size: cover;
    }

    /* Fondo con textura sutil encima */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background-image: url("https://www.transparenttextures.com/patterns/white-wall-3.png"); /* textura sutil */
      opacity: 0.15;
      z-index: -1;
    }
  </style>
</head>

<body class="mat-typography">
<app-root></app-root>
</body>
</html>
